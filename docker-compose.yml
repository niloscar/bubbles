services:
  db:
    image: mariadb:10.6
    restart: no
    volumes: 
      - dbstore:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
  site:
    depends_on:
      - db
    image: php:8.2-apache
    restart: no
    volumes:
      - ./public:/var/www/html
      - ./app:/var/www/app
      - ./config:/var/www/config
    ports:
      - 8080:80
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin
    restart: no
    ports:
      - 8081:80
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
volumes:
  dbstore: