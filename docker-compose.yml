name: sysdev-community-forum

services:
  db:
    image: mariadb:10.6
    restart: no
    volumes:
      - dbstore:/var/lib/mysql
    ports:
      - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: community_forum
      MYSQL_USER: forum
      MYSQL_PASSWORD: ${DB_PASSWORD}

  site:
    depends_on:
      - db
    build: .
    restart: no
    volumes:
      - ./public:/var/www/html
      - ./app:/var/www/app
      - ./config:/var/www/config
    ports:
      - 8080:80
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: community_forum
      DB_USER: forum
      DB_PASSWORD: ${DB_PASSWORD}

  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin
    restart: no
    ports:
      - 8081:80
    environment:
      PMA_HOST: db

volumes:
  dbstore: